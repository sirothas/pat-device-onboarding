# Build the installer: test -> helper -> verified OpenVPN MSI -> MSI -> bundle -> hashes -> SBOM
# -> provenance -> (tags) Release. WiX needs Windows, hence windows-latest.
#
# PHASE 3 (code signing) slots in at the three marked steps; until then artifacts are UNSIGNED and
# SmartScreen will warn. A signed Burn bundle needs its engine signed separately (detach -> sign
# engine -> reattach -> sign bundle), which is why signing is not a single step at the end.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write        # provenance attestation
      attestations: write
    env:
      WIX_VERSION: "5.0.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.1.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Unit tests (every trust decision, both directions)
        run: dotnet test tests/Pat.Onboarding.Core.Tests -c Release --nologo

      - name: Build the helper
        run: dotnet publish src/PatOnboarding -c Release -o out/helper -p:Version=${{ steps.v.outputs.version }} --nologo

      - name: Refuse a development trust key on a release tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          if (Select-String -Path src/PatOnboarding/TrustedKeys.cs -Pattern 'IsDevelopmentKey = true' -Quiet) {
            throw "TrustedKeys.cs still trusts the DEVELOPMENT tenant key - a public release must carry the KMS production key"
          }

      # PHASE 3: sign out/helper/PatOnboarding.exe and Pat.Onboarding.Core.dll here (cloud-HSM CA).

      - name: Fetch and VERIFY the OpenVPN MSI (hash AND Authenticode signer)
        shell: pwsh
        run: |
          $lock = Get-Content installer/openvpn.lock.json -Raw | ConvertFrom-Json
          Invoke-WebRequest -Uri $lock.url -OutFile out/openvpn.msi
          $h = (Get-FileHash out/openvpn.msi -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $lock.sha256) { throw "OpenVPN MSI hash $h is not the pinned $($lock.sha256)" }
          $sig = Get-AuthenticodeSignature out/openvpn.msi
          if ($sig.Status -ne 'Valid') { throw "OpenVPN MSI signature status: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notlike "*$($lock.signer_subject_contains)*") { throw "OpenVPN MSI is signed by '$($sig.SignerCertificate.Subject)'" }
          "OpenVPN $($lock.version): sha256 ok, signed by $($sig.SignerCertificate.Subject)"

      # The Bal extension is added to the WORKSPACE's .wix folder (searched first by `wix build`), not
      # the global cache: build #2's `wix extension add -g` reported success yet `wix build` then
      # failed WIX0144 "extension could not be found" in that global path. And it is LISTED here, so a
      # missing extension fails in this step, not two steps later.
      - name: WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version ${{ env.WIX_VERSION }}
          # WiX 5 names this extension WixToolset.BootstrapperApplications.wixext. Asking for the old
          # name (WixToolset.Bal.wixext) installs a package whose DLL WiX then cannot find - reported as
          # "(damaged)" with exit 0 (builds #2-#5).
          wix extension add WixToolset.BootstrapperApplications.wixext/${{ env.WIX_VERSION }}
          if ($LASTEXITCODE -ne 0) { throw "wix extension add failed ($LASTEXITCODE)" }
          $list = wix extension list | Out-String
          Write-Host $list
          if ($list -match 'damaged') { throw "a WiX extension reports itself damaged - extension add's exit code is not to be trusted: $list" }
          # Found where it ACTUALLY is, not where it is expected to be: builds #2 and #4 both passed
          # this step and then failed WIX0144 at a path that did not hold the DLL.
          $dll = Get-ChildItem -Recurse -File -Filter WixToolset.BootstrapperApplications.wixext.dll -Path (Join-Path $PWD '.wix'), (Join-Path $HOME '.wix') -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "WixToolset.BootstrapperApplications.wixext.dll is nowhere under .wix after extension add" }
          Write-Host "Bal extension: $($dll.FullName)"
          "BAL_EXT=$($dll.FullName)" >> $env:GITHUB_ENV

      # WiX runs through tools/wix.ps1, which turns every WiX error/warning line into a GitHub
      # annotation (readable through the PUBLIC API; the raw log is not) and FAILS on WIX8601: WiX
      # resolves a relative -d path against the .wxs file's folder, harvested nothing, and still
      # reported success - build #4's MSI held no helper at all. Paths are absolute ($PWD) for that.
      - name: Build the MSI
        shell: pwsh
        run: ./tools/wix.ps1 build installer/Package.wxs -arch x64 -d Version=${{ steps.v.outputs.version }} -d "PublishDir=$PWD/out/helper" -o out/PAT-Onboarding.msi

      # PHASE 3: sign out/PAT-Onboarding.msi here.

      - name: Build the bundle
        shell: pwsh
        run: ./tools/wix.ps1 build installer/Bundle.wxs -arch x64 -ext $env:BAL_EXT -d Version=${{ steps.v.outputs.version }} -d "OpenVpnMsi=$PWD/out/openvpn.msi" -d "OnboardingMsi=$PWD/out/PAT-Onboarding.msi" -o out/PAT-Onboarding-Setup.exe

      # PHASE 3: wix burn detach out/PAT-Onboarding-Setup.exe -engine out/engine.exe
      #          sign out/engine.exe
      #          wix burn reattach out/PAT-Onboarding-Setup.exe -engine out/engine.exe -o out/PAT-Onboarding-Setup.exe
      #          sign out/PAT-Onboarding-Setup.exe

      - name: Hashes
        shell: pwsh
        run: |
          Get-FileHash out/PAT-Onboarding-Setup.exe, out/PAT-Onboarding.msi -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content out/SHA256SUMS -Encoding ascii
          Get-Content out/SHA256SUMS

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: out
          format: cyclonedx-json
          output-file: out/sbom.cdx.json

      - name: Build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/PAT-Onboarding-Setup.exe
            out/PAT-Onboarding.msi

      - uses: actions/upload-artifact@v4
        with:
          name: pat-onboarding-${{ steps.v.outputs.version }}
          path: |
            out/PAT-Onboarding-Setup.exe
            out/PAT-Onboarding.msi
            out/SHA256SUMS
            out/sbom.cdx.json

  # The Ubuntu package: tests -> shellcheck -> .deb -> INSTALL it on each supported release, from that
  # release's own archive, and run the suite against the installed code. A package that builds but does
  # not install (a Depends missing from one release's archive) is caught here, not on a laptop.
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.1.${{ github.run_number }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Refuse a development trust key on a release tag
        if: github.ref_type == 'tag'
        run: |
          if grep -q '^IS_DEVELOPMENT_KEY = True' linux/pat_onboarding/keys.py; then
            echo "keys.py still trusts the DEVELOPMENT tenant key - a public release must carry the KMS production key" >&2; exit 1
          fi
      - name: Unit tests and shellcheck
        run: |
          sudo apt-get install -y -qq python3-cryptography shellcheck >/dev/null
          (cd linux && python3 -m unittest discover -s tests)
          shellcheck linux/tunnel-dns linux/build-deb.sh linux/dev-install.sh tools/vendor-pat-identity.sh
      - name: Build the .deb
        run: linux/build-deb.sh "${{ steps.v.outputs.version }}" out
      - name: Install and test on Ubuntu 24.04 and 26.04
        run: |
          for img in ubuntu:24.04 ubuntu:26.04; do
            docker run --rm -v "$PWD:/src:ro" "$img" bash -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq >/dev/null && apt-get install -y -qq /src/out/*.deb >/dev/null
              ! dpkg-query -W -f="\${Status}" krb5-config 2>/dev/null | grep -q installed
              pat-onboarding --version
              mkdir -p /w/linux /w/tests/Pat.Onboarding.Core.Tests
              cp -r /src/linux/tests /w/linux/ && cp -r /src/tests/Pat.Onboarding.Core.Tests/Data /w/tests/Pat.Onboarding.Core.Tests/
              ln -s /usr/lib/pat-onboarding/pat_onboarding /w/linux/pat_onboarding
              cd /w/linux && python3 -m unittest discover -s tests
              printf -- "- hosts: localhost\n  gather_facts: false\n  roles: [pat.identity.ca_trust, pat.identity.sssd_ad_join, pat.identity.pam_profile]\n" > /tmp/p.yml
              ANSIBLE_COLLECTIONS_PATH=/usr/share/pat-onboarding/collections ansible-playbook --syntax-check /tmp/p.yml'
          done
      - name: Hashes
        run: (cd out && sha256sum *.deb > SHA256SUMS.deb && cat SHA256SUMS.deb)
      - name: Build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: pat-onboarding-linux-${{ steps.v.outputs.version }}
          path: |
            out/*.deb
            out/SHA256SUMS.deb

  release:
    if: github.ref_type == 'tag'
    needs: [build, linux]
    runs-on: ubuntu-latest
    environment: release       # required reviewer: nothing is published without a human
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A block scalar: a plain one containing "Verify: ..." is read by YAML as a nested key
        # (the first push failed "Invalid workflow file ... line 129").
        run: |
          gh release create "${{ github.ref_name }}" dist/*/* --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "Verify: sha256sum -c SHA256SUMS; gh attestation verify PAT-Onboarding-Setup.exe --repo ${{ github.repository }}"
